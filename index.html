<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1967">
<title>E-PRESENT MANBAKU</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a1967'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white'>✓</text></svg>">
<style>
:root{--p:#1a1967;--pl:#4f46e5;--bg:#f3f4f6;--bd:#e5e7eb;--tx:#1f2937;--mu:#6b7280}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;margin-bottom:4px}
input,select,textarea{border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;background:#fff;max-width:100%}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--pl);color:#fff}
.btn.g{background:#fff;color:var(--tx);border:1px solid #d1d5db}
.btn.r{background:#dc2626}.btn.s{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{background:#f9fafb;font-size:11px;text-transform:uppercase;color:var(--mu);position:sticky;top:0}
.ctr{text-align:center}.mu{color:var(--mu)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#0f172a,#1e40af)}
#login .box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:380px}
#login h1{margin:0 0 4px;font-size:22px;color:var(--p)}
.tabs{display:flex;gap:6px;margin:16px 0}.tabs .btn{flex:1}
#login input{width:100%;margin-bottom:12px}
.err{background:#fef2f2;color:#b91c1c;padding:8px 10px;border-radius:8px;margin-top:10px;font-size:13px}
/* layout: sidebar */
#app{display:flex;min-height:100vh}
#side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--p);color:#fff;display:flex;flex-direction:column;z-index:30;transition:transform .25s ease}
.brand{padding:18px 18px 12px;display:flex;flex-direction:column}
.brand b{font-size:18px;letter-spacing:.5px}.brand small{color:#a5b4fc}
#nav{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:#c7d2fe;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;transition:background .15s,color .15s}
#nav button span{width:22px;text-align:center}
#nav button:hover{background:rgba(255,255,255,.08);color:#fff}
#nav button.on{background:var(--pl);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.usr{padding:12px 14px;border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-between;gap:8px}
.usr b{display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr small{display:block;color:#a5b4fc;font-size:10px;text-transform:uppercase}
.usr .btn{background:rgba(255,255,255,.12);color:#fff;border:0}
#content{flex:1;margin-left:236px;min-width:0}
#top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding:12px 18px;display:flex;align-items:center;gap:10px}
#top b{font-size:16px}#top .sp{flex:1}
.ham{display:none;border:0;background:transparent;font-size:22px;cursor:pointer;padding:0 4px}
#ov{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:25}
main{padding:16px 18px 40px;max-width:1100px;margin:auto}
#view>*{animation:fi .25s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#view>h2{display:none}
@media(max-width:820px){#side{transform:translateX(-100%)}#side.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.4)}#content{margin-left:0}.ham{display:block}#ov.on{display:block}main{padding:12px 10px 40px}#top{padding:10px 12px}}
button{transition:transform .1s,opacity .15s}button:active{transform:scale(.97)}
/* login: lihat password */
.pw{position:relative;margin-bottom:12px}.pw input{margin:0!important;padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mu);cursor:pointer;padding:6px 8px;line-height:0}
.eye:hover{color:var(--pl)}
/* daftar hadir: akordeon per kelas, tabel muat tanpa scroll samping */
.acc{background:#fff;border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.ah{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none;transition:background .15s}
.ah:hover{background:#f9fafb}
.ah small{color:var(--mu);margin-left:auto;white-space:nowrap}
.chev{font-size:10px;color:var(--mu);transition:transform .2s}.acc.open .chev{transform:rotate(90deg)}
.ab{display:none;border-top:1px solid var(--bd)}.acc.open .ab{display:block;animation:fi .2s ease}
.dht{table-layout:fixed;width:100%}
.dht th,.dht td{padding:5px 7px;white-space:normal;word-break:break-word;font-size:12px}
.dht select{width:100%;font-size:12px;padding:5px 3px}
.dht .lk select{opacity:1;color:inherit}
h2{margin:0 0 14px;font-size:18px}
.bdg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase}
.bdg.admin{background:#ede9fe;color:#6d28d9}.bdg.guru{background:#d1fae5;color:#047857}.bdg.pimpinan{background:#dbeafe;color:#1d4ed8}
.ukb{max-height:26vh;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:2px 10px}
.st{border-radius:8px;font-weight:700;padding:6px 8px;border:1px solid #d1d5db}
.st.hadir{background:#d1fae5;color:#047857}.st.izin{background:#dbeafe;color:#1d4ed8}
.st.sakit{background:#fef9c3;color:#a16207}.st.bolos{background:#ffedd5;color:#c2410c}.st.alpa{background:#fee2e2;color:#b91c1c}
.rk td,.rk th{padding:4px 5px;text-align:center;font-size:11px}
.rk td.n{text-align:left;position:sticky;left:0;background:#fff}
.cH{color:#16a34a;font-weight:700}.rk td.cH{font-size:17px;line-height:1}.cB{background:#ffedd5;color:#c2410c;font-weight:700}.cS{background:#fef9c3}.cI{background:#dbeafe}.cA{background:#fee2e2;color:#b91c1c;font-weight:700}.cL{background:#fef2f2;color:#fca5a5}
dialog{border:0;border-radius:14px;padding:20px;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{margin-top:10px}dialog input,dialog select,dialog textarea{width:100%}
#toast{position:fixed;top:14px;right:14px;z-index:99;display:flex;flex-direction:column;gap:6px}
#toast div{padding:10px 14px;border-radius:10px;color:#fff;font-weight:600;background:#059669;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#toast div.e{background:#dc2626}
#load{position:fixed;inset:0;background:rgba(15,23,42,.25);display:flex;align-items:center;justify-content:center;z-index:98}
#load i{width:42px;height:42px;border:4px solid #e0e7ff;border-top-color:var(--pl);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lk{cursor:pointer;white-space:nowrap}.st:disabled{opacity:.9}
#offb{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#fff;padding:6px 14px;border-radius:99px;font-weight:700;font-size:12px;z-index:97}
#offl{background:#f59e0b;color:#fff;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
</style>
</head>
<body>

<div id="login">
  <form class="box" onsubmit="doLogin(event)">
    <h1>E-PRESENT MANBAKU</h1>
    <div class="mu">Sistem Absensi Digital — Manba'ul Huda</div>
    <div class="tabs">
      <button type="button" class="btn" id="tS" onclick="loginTab('siswa')">Siswa</button>
      <button type="button" class="btn g" id="tA" onclick="loginTab('admin')">Guru / Admin</button>
    </div>
    <div id="fS"><label>NISN</label><input id="nisn" autocomplete="off" autocapitalize="none" placeholder="Masukkan NISN"></div>
    <div id="fA" class="hidden">
      <label>Username</label><input id="usr" autocapitalize="none" placeholder="Username">
      <label>Password</label><div class="pw"><input id="pwd" type="password" placeholder="••••••••" autocomplete="current-password"><button type="button" class="eye" onclick="togglePwd(this)" aria-label="Lihat password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    </div>
    <button class="btn" style="width:100%;padding:11px">MASUK</button>
    <div id="lerr" class="err hidden"></div>
  </form>
</div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><b>E-PRESENT</b><small>Manba'ul Huda</small></div>
    <nav id="nav"></nav>
    <div class="usr"><div><b id="uNm"></b><small id="uRl"></small></div><button class="btn s" onclick="logout()">Keluar</button></div>
  </aside>
  <div id="ov" onclick="side(false)"></div>
  <div id="content">
    <div id="top"><button class="ham" onclick="side(true)" aria-label="Menu">☰</button><b id="ttl"></b><span class="sp"></span><span id="offl" class="hidden">⚠ Offline</span></div>
    <main id="view"></main>
  </div>
</div>

<div id="toast"></div>
<div id="offb" class="hidden"></div>
<div id="load" class="hidden"><i></i></div>
<dialog id="dlg"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
// ======================= KONFIG & UTIL =======================
const API_URL = 'https://script.google.com/macros/s/AKfycbwiWT3pZCosH3cwWjTkMaa6ftFSpsKO-71rQdU9LCvJl5Xvo7IRP1TOoBAXA4vJZYnx/exec';
const SESSION_KEY = 'absensiAppSession';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const STATUS = ['hadir','izin','sakit','bolos','alpa'];
let user = null, kelasList = [], siswaCache = null, siswa = [];

async function api(fn, ...args) {
  for (let i = 1; i <= 3; i++) {
    try {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args, token: user && user.token }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (j.error) {
        const er = new Error(j.error); er.final = true;          // error dari server: jangan diulang
        if (/Sesi berakhir/.test(j.error) && user) { toast(j.error, true); setTimeout(logout, 1200); }
        throw er;
      }
      return j.result;
    } catch (e) {
      if (i === 3 || e.final) throw e;
      await new Promise(r => setTimeout(r, i * 1500));
    }
  }
}
const busy = on => $('#load').classList.toggle('hidden', !on);
function toast(msg, err) {
  const d = document.createElement('div');
  if (err) d.className = 'e';
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), 3200);
}
const fail = e => { busy(false); toast('Gagal: ' + (e.message || e), true); };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
async function getSiswa(force) {
  if (siswaCache && !force) return siswaCache;
  const r = await api('getSiswaList', '');
  const list = (r && r.success) ? r.data : (Array.isArray(r) ? r : []);
  siswaCache = list.map(s => ({ ...s, nama: String(s.nama || '').trim(), nisn: String(s.nisn || '').trim(), kelas: String(s.kelas || '').trim() }));
  return siswaCache;
}
async function getKelas() {
  if (!kelasList.length) {
    const r = await api('getDaftarKelas');
    kelasList = Array.isArray(r) ? r : (r && r.data) || [];
  }
  return kelasList;
}
const natural = (a, b) => String(a).localeCompare(String(b), 'id', { numeric: true });
const myKelas = () => (user.role === 'guru' && user.kelas) ? String(user.kelas).split(',').map(k => k.trim()).filter(Boolean) : [];
const opt = (arr, sel, first) => (first !== undefined ? `<option value="">${first}</option>` : '') + arr.map(k => `<option ${k === sel ? 'selected' : ''}>${esc(k)}</option>`).join('');

// ======================= LOGIN / SESI =======================
const EYE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function togglePwd(b, id) {
  const i = $('#' + (id || 'pwd')), show = i.type === 'password';
  i.type = show ? 'text' : 'password'; b.innerHTML = show ? EYEOFF : EYE;
  b.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Lihat password');
}
function loginTab(t) {
  const s = t === 'siswa';
  $('#fS').classList.toggle('hidden', !s); $('#fA').classList.toggle('hidden', s);
  $('#tS').className = 'btn' + (s ? '' : ' g'); $('#tA').className = 'btn' + (s ? ' g' : '');
  $('#lerr').classList.add('hidden');
}
async function doLogin(e) {
  e.preventDefault();
  const siswaMode = !$('#fS').classList.contains('hidden');
  busy(true);
  try {
    let r;
    if (siswaMode) {
      const n = $('#nisn').value.trim();
      if (!n) throw new Error('Masukkan NISN terlebih dahulu.');
      for (const v of [...new Set([n, n.toUpperCase(), n.toLowerCase()])]) {
        r = await api('login', '', '', v);
        if (r && r.success) break;
      }
    } else {
      const u = $('#usr').value.trim(), p = $('#pwd').value;
      if (!u || !p) throw new Error('Masukkan username dan password.');
      for (const v of [...new Set([u, u.toLowerCase()])]) {
        r = await api('login', v, p, '');
        if (r && r.success) break;
      }
    }
    busy(false);
    if (r && r.success) { store.set(SESSION_KEY, r); start(r); }
    else { const b = $('#lerr'); b.textContent = (r && r.message) || 'Login gagal.'; b.classList.remove('hidden'); }
  } catch (err) { busy(false); const b = $('#lerr'); b.textContent = err.message; b.classList.remove('hidden'); }
}
function logout() { store.del(SESSION_KEY); location.reload(); }

// ======================= NAVIGASI (sidebar) =======================
const MENU = {
  admin:    [['Daftar Hadir', vHadir, '📋'], ['Ekstrakurikuler', vEkskul, '🏅'], ['Data Siswa', vSiswa, '🎓'], ['Rekap Bulanan', vRekap, '📅'], ['Hari Libur', vLibur, '🏖️'], ['Manajemen Kelas', vKelasMgr, '🏫'], ['Kenaikan Kelas', vNaik, '⬆️'], ['Data User', vUser, '👥']],
  guru:     [['Daftar Hadir', vHadir, '📋'], ['Ekstrakurikuler', vEkskul, '🏅'], ['Rekap Bulanan', vRekap, '📅']],
  pimpinan: [['Rekap Bulanan', vRekap, '📅']],
  siswa:    [['Absensi Saya', vSiswaDash, '✅']]
};
const side = on => { $('#side').classList.toggle('open', on); $('#ov').classList.toggle('on', on); };
function start(u) {
  user = u;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#uNm').textContent = u.nama || u.username || ''; $('#uRl').textContent = u.role;
  const m = MENU[u.role] || MENU.siswa;
  $('#nav').innerHTML = m.map((x, i) => `<button onclick="go(${i})"><span>${x[2]}</span>${x[0]}</button>`).join('');
  go(0);
}
function go(i) {
  const m = MENU[user.role] || MENU.siswa;
  document.querySelectorAll('#nav button').forEach((b, j) => b.classList.toggle('on', i === j));
  $('#ttl').textContent = m[i][0]; side(false);
  $('#view').innerHTML = '<div class="card mu">Memuat...</div>';
  Promise.resolve(m[i][1]()).catch(e => {
    fail(e);
    $('#view').innerHTML = `<div class="card"><div class="err">Gagal memuat: ${esc(e.message || e)}</div><button class="btn" style="margin-top:10px" onclick="go(${i})">Coba lagi</button></div>`;
  });
}

// ======================= HALAMAN SISWA =======================
async function vSiswaDash() {
  const r = await api('getAbsensiToday', user.nisn);
  const a = r && r.success ? r.data : null;
  const status = r.isLibur ? 'HARI LIBUR — ' + esc(r.keteranganLibur) : !a ? 'BELUM ABSEN' : a.status === 'Hadir' ? 'HADIR HARI INI' : a.status.toUpperCase() + ' HARI INI';
  $('#view').innerHTML = `<div style="font-size:18px;font-weight:700;margin-bottom:12px">Hai, ${esc((user.nama || '').split(' ')[0])}</div>
    <div class="card"><b>${esc(user.nama)}</b><div class="mu">NISN ${esc(user.nisn)} · Kelas ${esc(user.kelas)}</div></div>
    <div class="card"><div class="mu">${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
    <div style="font-size:20px;font-weight:800;margin:6px 0">${status}</div>
    ${!a && !r.isLibur ? '<div class="err">Anda belum tercatat absen hari ini. Hubungi guru kelas.</div>' : ''}</div>`;
}

// ======================= OFFLINE QUEUE (IndexedDB) =======================
const QS = 'pending-absensi';
const idb = () => new Promise((ok, no) => { const r = indexedDB.open('epresent-offline-db', 1); r.onupgradeneeded = () => r.result.createObjectStore(QS, { keyPath: 'id', autoIncrement: true }); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const idbDo = async (mode, f) => { const db = await idb(); return new Promise((ok, no) => { const t = db.transaction(QS, mode), rq = f(t.objectStore(QS)); t.oncomplete = () => ok(rq && rq.result); t.onerror = () => no(t.error); }); };
async function qBadge() {
  let n = 0; try { n = (await idbDo('readonly', s => s.getAll())).length; } catch (e) {}
  const b = $('#offb'); b.textContent = '📥 ' + n + ' data belum terkirim'; b.classList.toggle('hidden', !n);
}
// Tulis data; bila offline/gagal koneksi → masuk antrian & terkirim otomatis saat online
async function apiW(fn, ...args) {
  const q = async () => { await idbDo('readwrite', s => s.add({ fn, args, ts: Date.now() })); qBadge(); return { success: true, offline: true }; };
  if (!navigator.onLine) return q();
  try { return await api(fn, ...args); } catch (e) { return q(); }
}
let syncing = false;
async function syncQ() {
  if (!navigator.onLine || syncing) return; syncing = true;
  try {
    const items = await idbDo('readonly', s => s.getAll()); let ok = 0;
    for (const it of items) {
      try { await api(it.fn, ...it.args); await idbDo('readwrite', s => s.delete(it.id)); ok++; } catch (e) { break; }
    }
    qBadge();
    if (ok) { toast('✅ ' + ok + ' data offline tersinkron'); if ($('#dhC')) dhLoad(); }
  } catch (e) {} finally { syncing = false; }
}

// ======================= DAFTAR HADIR =======================
let dh = { tgl: '', kelas: [] };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const oleh = () => user.nama || user.username || 'Guru';
async function vHadir() {
  dh.tgl = today();
  const all = await getSiswa();
  const mine = myKelas(), by = {};
  all.forEach(s => { const k = s.kelas || 'Tanpa Kelas'; (by[k] = by[k] || []).push(s); });
  const keys = (mine.length ? mine : Object.keys(by)).sort(natural);   // guru multi-kelas: semua kelas miliknya
  dh.kelas = keys.map(k => ({ k, list: (by[k] || []).sort((a, b) => a.nama.localeCompare(b.nama)), saved: {}, open: false }));
  $('#view').innerHTML = `<div class="card row"><div><label>Tanggal</label><input type="date" id="dhT" value="${dh.tgl}" onchange="dhLoad()"></div>
    <div class="mu" style="flex:1;min-width:200px">Pilih kelas untuk membuka daftar siswa. Ubah status = langsung tersimpan, dan bisa diubah kapan saja.</div></div><div id="dhC"></div>`;

}
async function dhLoad() {
  dh.tgl = $('#dhT').value;
  await Promise.all(dh.kelas.map(async c => {
    c.saved = {};
    try {
      const r = await api('getDaftarHadirByKelasAndTanggal', c.k, dh.tgl);
      if (r && r.success && r.data) Object.entries(r.data).forEach(([n, d]) => { c.saved[n] = String((d && d.status) || d || '').toLowerCase(); });
    } catch (e) {}
  }));
  if ($('#dhC')) dhDraw();
}
const dhN = c => c.list.filter(s => c.saved[s.nisn]).length;
function dhCnt(ci) { const c = dh.kelas[ci], e = $('#ak' + ci); if (e) e.textContent = dhN(c) + '/' + c.list.length + ' terisi'; }
function dhCell(ci, si) {
  const c = dh.kelas[ci], s = c.list[si], v = c.saved[s.nisn] || '';
  return `<select class="st ${v}" onchange="dhSet(${ci},${si},this)">${v ? '' : '<option value="">Pilih</option>'}${STATUS.map(x => `<option value="${x}" ${v === x ? 'selected' : ''}>${cap(x)}</option>`).join('')}</select>`;
}
function dhBody(ci) {
  const c = dh.kelas[ci];
  return `<table class="dht"><colgroup><col style="width:30px"><col><col style="width:104px"></colgroup>
    <thead><tr><th>No</th><th>Nama</th><th>Status</th></tr></thead><tbody>
    ${c.list.map((s, si) => `<tr><td>${si + 1}</td><td>${esc(s.nama)}</td><td id="c${ci}_${si}">${dhCell(ci, si)}</td></tr>`).join('') || '<tr><td colspan="3" class="mu ctr">Tidak ada siswa.</td></tr>'}</tbody></table>`;
}
function dhDraw() {
  $('#dhC').innerHTML = dh.kelas.map((c, ci) => `<div class="acc ${c.open ? 'open' : ''}" id="ac${ci}">
    <div class="ah" onclick="dhTog(${ci})"><span class="chev">▶</span><b>${esc(c.k)}</b><small id="ak${ci}"></small>
    <button class="btn g s" onclick="event.stopPropagation();dhAll(${ci})">✓ Sisanya Hadir</button></div>
    <div class="ab" id="ab${ci}">${c.open ? dhBody(ci) : ''}</div></div>`).join('') || '<div class="card mu">Tidak ada kelas.</div>';
  dh.kelas.forEach((c, ci) => dhCnt(ci));
}
function dhTog(ci) {
  const c = dh.kelas[ci]; c.open = !c.open;
  $('#ac' + ci).classList.toggle('open', c.open);
  if (c.open) $('#ab' + ci).innerHTML = dhBody(ci);
}
const dhRef = (ci, si) => { const e = $('#c' + ci + '_' + si); if (e) e.innerHTML = dhCell(ci, si); dhCnt(ci); };
async function dhSet(ci, si, el) {
  const c = dh.kelas[ci], s = c.list[si], v = el.value;
  if (!v) return dhRef(ci, si);
  el.className = 'st ' + v; el.disabled = true;
  try {
    const r = await apiW('submitDaftarHadirGuru', [{ nisn: s.nisn, nama: s.nama, kelas: c.k, status: v }], dh.tgl, oleh());
    if (!r || !r.success) throw new Error((r && r.message) || 'Gagal menyimpan');
    c.saved[s.nisn] = v;
    toast(r.offline ? '📥 Tersimpan offline — terkirim saat online' : s.nama.split(' ')[0] + ' → ' + v);
  } catch (e) { toast(e.message, true); }
  dhRef(ci, si);
}
async function dhAll(ci) {
  const c = dh.kelas[ci], t = c.list.filter(s => !c.saved[s.nisn]);
  if (!t.length) return toast('Semua siswa sudah terisi.');
  if (!confirm(`Tandai ${t.length} siswa ${c.k} yang belum terisi sebagai HADIR?`)) return;
  busy(true);
  try {
    const r = await apiW('submitDaftarHadirGuru', t.map(s => ({ nisn: s.nisn, nama: s.nama, kelas: c.k, status: 'hadir' })), dh.tgl, oleh());
    if (!r || !r.success) throw new Error((r && r.message) || 'Gagal menyimpan');
    t.forEach(s => { c.saved[s.nisn] = 'hadir'; });
    busy(false); dhDraw(); toast(r.offline ? '📥 Tersimpan offline' : t.length + ' siswa ditandai hadir');
  } catch (e) { fail(e); }
}

function rTable(d, kelas) {
  const days = Array.from({ length: d.daysInMonth }, (_, i) => i + 1), cols = 2 + d.daysInMonth + 6;
  const row = (s, n) => `<tr><td>${n}</td><td class="n">${esc(s.nama)}</td>${s.dailyCodes.map(x => `<td class="c${x.code}">${x.code === 'H' ? '•' : x.code}</td>`).join('')}
    <td class="cH">${s.stats.h}</td><td>${s.stats.s}</td><td>${s.stats.i}</td><td class="cB">${s.stats.b}</td><td class="cA">${s.stats.a}</td><td><b>${s.stats.percent}%</b></td></tr>`;
  let body = '';
  if (kelas) body = d.students.map((s, i) => row(s, i + 1)).join('');
  else {
    const g = {};
    d.students.forEach(s => (g[s.kelas || 'Tanpa Kelas'] = g[s.kelas || 'Tanpa Kelas'] || []).push(s));
    Object.keys(g).sort(natural).forEach(k => { body += `<tr><td colspan="${cols}" style="background:var(--pl);color:#fff;text-align:left;padding:5px 8px"><b>Kelas ${esc(k)}</b> (${g[k].length})</td></tr>` + g[k].map((s, i) => row(s, i + 1)).join(''); });
  }
  return `<table class="rk"><thead><tr><th>No</th><th>Nama</th>${days.map(x => `<th>${x}</th>`).join('')}<th>H</th><th>S</th><th>I</th><th>B</th><th>A</th><th>%</th></tr></thead><tbody>${body || `<tr><td colspan="${cols}">Tidak ada data.</td></tr>`}</tbody></table>`;
}

    busy(false);
    if (!r.success) { rLast = null; return ($('#rO').textContent = r.message); }

  } catch (e) { fail(e); }

// Unduh PDF: file PDF dibuat langsung di browser (A4 landscape) lalu otomatis terunduh
function rPdf() {
  if (!rLast) return toast('Klik Tampilkan dulu sebelum mengunduh.', true);
  if (!window.jspdf) return toast('Pustaka PDF belum termuat. Periksa koneksi internet lalu muat ulang halaman.', true);
  const { d, k, b, t } = rLast, nd = d.daysInMonth, cols = 2 + nd + 6;
  const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
  doc.text('REKAPITULASI ABSENSI BULANAN SISWA', 148.5, 10, { align: 'center' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  doc.text('Kelas: ' + (k || 'Semua Kelas') + '   |   Periode: ' + BULAN[b] + ' ' + t, 148.5, 15, { align: 'center' });
  const row = (s, n) => [n, s.nama, ...s.dailyCodes.map(x => x.code), s.stats.h, s.stats.s, s.stats.i, s.stats.b, s.stats.a, s.stats.percent + '%'];
  const body = [];
  if (k) d.students.forEach((s, i) => body.push(row(s, i + 1)));
  else {
    const g = {};
    d.students.forEach(s => (g[s.kelas || 'Tanpa Kelas'] = g[s.kelas || 'Tanpa Kelas'] || []).push(s));
    Object.keys(g).sort(natural).forEach(kk => {
      body.push([{ content: 'Kelas ' + kk + ' (' + g[kk].length + ')', colSpan: cols, styles: { halign: 'left', fontStyle: 'bold', fillColor: [79, 70, 229], textColor: 255 } }]);
      g[kk].forEach((s, i) => body.push(row(s, i + 1)));
    });
  }
  const warna = { H: [22, 163, 74], S: [161, 98, 7], I: [29, 78, 216], B: [194, 65, 12], A: [185, 28, 28], L: [252, 165, 165] };
  const latar = { S: [254, 249, 195], I: [219, 234, 254], B: [255, 237, 213], A: [254, 226, 226], L: [254, 242, 242] };
  doc.autoTable({
    head: [['No', 'Nama', ...Array.from({ length: nd }, (_, i) => String(i + 1)), 'H', 'S', 'I', 'B', 'A', '%']],
    body, startY: 19, theme: 'grid', margin: { left: 7, right: 7, top: 8, bottom: 8 },
    styles: { fontSize: 6, cellPadding: 0.7, halign: 'center', valign: 'middle', lineWidth: 0.1, lineColor: [150, 150, 150] },
    headStyles: { fillColor: [67, 56, 202], textColor: 255 },
    columnStyles: { 0: { cellWidth: 6 }, 1: { halign: 'left', cellWidth: 38 } },
    didParseCell(h) {
      const c = h.cell.raw;
      if (h.section !== 'body' || typeof c !== 'string' || h.column.index < 2 || h.column.index >= 2 + nd) return;
      if (c === 'H') { h.cell.text = ['•']; h.cell.styles.fontSize = 11; }
      if (warna[c]) { h.cell.styles.textColor = warna[c]; h.cell.styles.fontStyle = 'bold'; }
      if (latar[c]) h.cell.styles.fillColor = latar[c];
    },
    didDrawPage(h) { doc.setFontSize(7); doc.setTextColor(90); doc.text('• = Hadir · S: Sakit · I: Izin · B: Bolos · A: Alpa · L: Libur   |   Diunduh: ' + new Date().toLocaleString('id-ID') + '   |   Hal. ' + h.pageNumber, 7, 205); doc.setTextColor(0); }
  });
  doc.save('Rekap_Absensi_' + (k || 'Semua_Kelas').replace(/\s+/g, '_') + '_' + BULAN[b] + '_' + t + '.pdf');
  toast('PDF diunduh');
}

// Menghapus permanen absensi satu bulan agar spreadsheet tetap ringan. Unduh PDF dulu sebelum menghapus.
async function hapusBulan() {
  const b = +$('#rB').value, t = +$('#rT').value, k = $('#rK').value, lbl = BULAN[b] + ' ' + t + ' (' + (k || 'Semua Kelas') + ')';
  if (!confirm('HAPUS data absensi ' + lbl + '?\n\nData dihapus PERMANEN dari spreadsheet dan tidak bisa dikembalikan.\nPastikan rekap sudah diunduh lewat tombol "Unduh PDF".')) return;
  if ((prompt('Ketik HAPUS untuk melanjutkan:') || '').trim().toUpperCase() !== 'HAPUS') return toast('Dibatalkan.', true);
  busy(true);
  try {
    const r = await api('hapusAbsensiBulan', b, t, k); busy(false);
    if (!r || !r.success) return toast((r && r.message) || 'Gagal menghapus data.', true);
    toast(r.message); rLoad();
  } catch (e) { fail(e); }
}

// ======================= EKSTRAKURIKULER =======================
const EK = 'ep_ekskul_v1', HARI = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
let ek = { ekskul: [], absensi: [] }, ekId = null, ekTab = 'a', ekSt = {}, ekTgl = today();
const ekVis = () => {
  if (user.role === 'guru') { const n = String(user.nama || '').toLowerCase().trim(); if (n) return ek.ekskul.filter(e => String(e.pembina || '').toLowerCase().includes(n)); }
  return ek.ekskul;
};
async function vEkskul() {
  ek = store.get(EK) || { ekskul: [], absensi: [] }; ekTab = 'a'; ekTgl = today();
  ekDraw();   // instan dari cache
  try {
    const r = await api('getEkskulList');
    if (!r || !r.success || !r.data) return;
    const sv = r.data, ids = new Set((sv.ekskul || []).map(e => e.id)), ks = new Set((sv.absensi || []).map(a => a.ekskulId + '|' + a.tanggal));
    ek = { ekskul: (sv.ekskul || []).concat(ek.ekskul.filter(e => !ids.has(e.id))), absensi: (sv.absensi || []).concat(ek.absensi.filter(a => !ks.has(a.ekskulId + '|' + a.tanggal))) };
    store.set(EK, ek); if ($('#ekW')) ekDraw();
  } catch (e) {}
}
function ekDraw() {
  const adm = user.role === 'admin';
  $('#view').innerHTML = `<h2>Ekstrakurikuler</h2><div class="row" style="margin-bottom:12px">
    <button class="btn ${ekTab === 'a' ? '' : 'g'}" onclick="ekTab='a';ekDraw()">Absensi</button>
    ${adm ? `<button class="btn ${ekTab === 'k' ? '' : 'g'}" onclick="ekTab='k';ekDraw()">Kelola Ekskul</button>` : ''}</div><div id="ekW"></div>`;
  (ekTab === 'k' && adm) ? ekKelola() : ekAbs();
}
function ekAbs() {
  const l = ekVis();
  if (!l.some(e => e.id === ekId)) ekId = l[0] && l[0].id;
  const e = l.find(x => x.id === ekId);
  if (!e) { $('#ekW').innerHTML = `<div class="card mu">${ek.ekskul.length ? 'Anda bukan pembina ekskul yang terdaftar. Hubungi admin.' : 'Belum ada ekskul terdaftar.'}</div>`; return; }
  const rec = ek.absensi.find(a => a.ekskulId === e.id && a.tanggal === ekTgl);
  ekSt = rec ? { ...rec.data } : {};
  const riw = ek.absensi.filter(a => a.ekskulId === e.id).slice(0, 8);
  $('#ekW').innerHTML = `<div class="card row"><div><label>Ekskul</label><select onchange="ekId=this.value;ekAbs()">${l.map(x => `<option value="${esc(x.id)}" ${x.id === ekId ? 'selected' : ''}>${esc(x.nama)} (${esc(x.hari)})</option>`).join('')}</select></div>
    <div><label>Tanggal</label><input type="date" value="${ekTgl}" onchange="ekTgl=this.value;ekAbs()"></div>
    <div class="mu">Pembina: <b>${esc(e.pembina)}</b> · ${esc(e.hari)} ${esc(e.jamMulai)}–${esc(e.jamSelesai)} · ${e.anggota.length} anggota</div></div>
    <div class="card tw" style="max-height:55vh"><table><thead><tr><th>No</th><th>Nama</th><th>Status</th></tr></thead><tbody>
    ${e.anggota.map((s, i) => { const v = ekSt[s.nisn] || ''; return `<tr><td>${i + 1}</td><td>${esc(s.nama)}</td><td><select class="st ${v}" onchange="ekSet(${i},this)"><option value="">Pilih Status</option>${STATUS.map(x => `<option value="${x}" ${v === x ? 'selected' : ''}>${cap(x)}</option>`).join('')}</select></td></tr>`; }).join('') || '<tr><td colspan="3" class="mu ctr">Belum ada anggota.</td></tr>'}
    </tbody></table></div>
    <div class="card row"><span>Terisi: <b id="ekCnt"></b></span><span style="flex:1"></span><button class="btn g" onclick="ekAll()">✓ Tandai Semua Hadir</button><button class="btn" onclick="ekKirim()">Kirim Absensi</button></div>
    ${riw.length ? `<div class="card"><b>Riwayat Terakhir</b>${riw.map(a => `<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${new Date(a.tanggal).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} <small class="mu">${Object.keys(a.data).length} diisi · ${Object.values(a.data).filter(v => v === 'hadir').length} hadir · ${esc(a.oleh)}</small></span><button class="btn g s" onclick="ekTgl='${esc(a.tanggal)}';ekAbs()">Buka</button></div>`).join('')}</div>` : ''}`;
  ekCnt();
}
const ekCur = () => ekVis().find(x => x.id === ekId);
const ekCnt = () => { const e = ekCur(), el = $('#ekCnt'); if (e && el) el.textContent = Object.keys(ekSt).length + ' / ' + e.anggota.length; };
function ekSet(i, el) { const s = ekCur().anggota[i]; if (el.value) ekSt[s.nisn] = el.value; else delete ekSt[s.nisn]; el.className = 'st ' + el.value; ekCnt(); }
function ekAll() { ekCur().anggota.forEach(s => ekSt[s.nisn] = 'hadir'); document.querySelectorAll('#ekW tbody select').forEach(el => { el.value = 'hadir'; el.className = 'st hadir'; }); ekCnt(); }
async function ekKirim() {
  const e = ekCur(), n = Object.keys(ekSt).length;
  if (!n) return toast('Belum ada anggota yang diisi statusnya.', true);
  if (!confirm(`Kirim absensi ${e.nama} • ${ekTgl}?\n${Object.values(ekSt).filter(v => v === 'hadir').length} hadir dari ${n} terisi.`)) return;
  busy(true);
  try {
    const r = await apiW('saveEkskulAbsensi', user.token, e.id, ekTgl, { ...ekSt }, oleh()); busy(false);
    if (!r || r.success === false) return toast((r && r.message) || 'Gagal menyimpan.', true);
    const rec = (r && r.data) || { id: e.id + '|' + ekTgl, ekskulId: e.id, tanggal: ekTgl, data: { ...ekSt }, oleh: oleh() };
    const ex = ek.absensi.find(a => a.ekskulId === e.id && a.tanggal === ekTgl);
    if (ex) Object.assign(ex, rec); else ek.absensi.unshift(rec);
    store.set(EK, ek); toast(r.offline ? '📥 Tersimpan offline — terkirim saat online' : 'Absensi ekskul tersimpan'); ekAbs();
  } catch (x) { fail(x); }
}
function ekKelola() {
  $('#ekW').innerHTML = `<div class="card row" style="justify-content:space-between"><span class="mu">Atur ekskul, pembina, jadwal, dan anggota.</span><button class="btn" onclick="ekForm()">+ Tambah Ekskul</button></div>
    ${ek.ekskul.map(e => `<div class="card row" style="justify-content:space-between"><div><b>${esc(e.nama)}</b> <small class="mu">${e.anggota.length} anggota</small><div class="mu">Pembina: ${esc(e.pembina)} · ${esc(e.hari)} ${esc(e.jamMulai)}–${esc(e.jamSelesai)}</div></div>
    <div><button class="btn g s" onclick="ekForm('${esc(e.id)}')">Edit</button> <button class="btn r s" onclick="ekHapus('${esc(e.id)}')">Hapus</button></div></div>`).join('') || '<div class="card mu">Belum ada ekskul.</div>'}`;
}
const pbOpt = (gurus, sel) => {
  const names = [...new Set(gurus.map(g => g.nama))].sort((a, b) => a.localeCompare(b));
  if (sel && !names.includes(sel)) names.unshift(sel);   // pembina lama yang akunnya sudah tidak ada tetap tampil
  return names.map(n => `<option value="${esc(n)}" ${n === sel ? 'selected' : ''}>${esc(n)}</option>`).join('');
};
async function ekForm(id) {
  busy(true);
  let gurus = [];
  try {
    await getSiswa();
    try { const ur = await api('getUsers'); gurus = ((ur && ur.data) || []).filter(u => u.role === 'guru'); } catch (x) {}
  } catch (e) { busy(false); return fail(e); }
  busy(false);
  const e = id ? ek.ekskul.find(x => x.id === id) : null, on = new Set((e ? e.anggota : []).map(a => a.nisn)), by = {};
  siswaCache.forEach(s => (by[s.kelas || 'Tanpa Kelas'] = by[s.kelas || 'Tanpa Kelas'] || []).push(s));
  $('#dlg').innerHTML = `<form onsubmit="ekSave(event,'${e ? esc(e.id) : ''}')"><h2>${e ? 'Edit' : 'Tambah'} Ekskul</h2>
    <label>Nama Ekskul</label><input name="nama" required value="${esc(e && e.nama)}">
    <label>Guru Pembina</label><select name="pembina" required><option value="">-- Pilih Guru --</option>${pbOpt(gurus, e && e.pembina)}</select>
    <div class="row"><div style="flex:1"><label>Hari</label><select name="hari">${opt(HARI, e && e.hari)}</select></div>
    <div style="flex:1"><label>Mulai</label><input type="time" name="jamMulai" value="${esc(e ? e.jamMulai : '15:30')}"></div>
    <div style="flex:1"><label>Selesai</label><input type="time" name="jamSelesai" value="${esc(e ? e.jamSelesai : '17:00')}"></div></div>
    <label>Anggota (<span id="ekJ">${on.size}</span> dipilih)</label><input placeholder="Cari nama..." oninput="ekCari(this.value)">
    <div id="ekL" style="max-height:30vh;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:6px;margin-top:6px" onchange="$('#ekJ').textContent=document.querySelectorAll('.ekc:checked').length">
    ${Object.keys(by).sort(natural).map(k => `<div><small><b style="color:var(--pl)">${esc(k)}</b></small>${by[k].map(s => `<label style="display:flex;gap:6px;text-transform:none;font-weight:400;color:var(--tx);margin:2px 0" data-n="${esc(s.nama.toLowerCase())}"><input type="checkbox" class="ekc" style="width:auto" value="${esc(s.nisn)}" ${on.has(s.nisn) ? 'checked' : ''}>${esc(s.nama)}</label>`).join('')}</div>`).join('')}</div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn g" onclick="$('#dlg').close()">Batal</button><button class="btn">Simpan</button></div></form>`;
  $('#dlg').showModal();
}
const ekCari = q => { q = q.toLowerCase().trim(); document.querySelectorAll('#ekL label').forEach(l => l.style.display = (!q || l.dataset.n.includes(q)) ? 'flex' : 'none'); };
async function ekSave(ev, id) {
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target)), m = new Map(siswaCache.map(s => [s.nisn, s]));
  f.anggota = [...document.querySelectorAll('.ekc:checked')].map(c => { const s = m.get(c.value) || {}; return { nisn: c.value, nama: s.nama || c.value, kelas: s.kelas || '' }; });
  if (!f.anggota.length) return toast('Pilih minimal satu anggota.', true);
  f.id = id; busy(true);
  try {
    const r = await api('saveEkskul', user.token, f); busy(false);
    if (!r || !r.success) return toast((r && r.message) || 'Gagal menyimpan.', true);
    const sv = { ...f, ...(r.data || {}) }, ex = ek.ekskul.find(x => x.id === sv.id);
    if (ex) Object.assign(ex, sv); else ek.ekskul.push(sv);
    store.set(EK, ek); $('#dlg').close(); toast(r.message || 'Tersimpan'); ekDraw();
  } catch (e) { fail(e); }
}
async function ekHapus(id) {
  const e = ek.ekskul.find(x => x.id === id);
  if (!confirm(`Hapus ekskul "${e.nama}" beserta seluruh riwayat absensinya?`)) return;
  busy(true);
  try {
    const r = await api('deleteEkskul', user.token, id); busy(false);
    if (!r || !r.success) return toast((r && r.message) || 'Gagal menghapus.', true);
    ek.ekskul = ek.ekskul.filter(x => x.id !== id); ek.absensi = ek.absensi.filter(a => a.ekskulId !== id);
    store.set(EK, ek); toast('Ekskul dihapus'); ekDraw();
  } catch (e) { fail(e); }
}

// ======================= DATA USER (admin) =======================
let us = [];
const ROLE_INFO = {
  admin: 'Akses penuh: semua menu, kelola data siswa, kelas, libur, ekskul, dan user.',
  guru: 'Daftar Hadir, Ekstrakurikuler, dan Rekap Bulanan — hanya untuk kelas yang dicentang di bawah.',
  pimpinan: 'Hanya melihat Rekap Bulanan (tanpa mengubah data).'
};
async function vUser() {
  await getKelas();
  const r = await api('getUsers');
  us = (r && r.data) || [];
  const hak = u => u.role === 'admin' ? 'Semua menu' : u.role === 'pimpinan' ? 'Lihat rekap' : (u.kelas ? 'Kelas: ' + esc(u.kelas.split(',').join(', ')) : 'Semua kelas');
  $('#view').innerHTML = `<h2>Data User</h2>
    <div class="card row" style="justify-content:space-between"><span class="mu">${us.length} user terdaftar · ${us.filter(u => u.role === 'admin').length} admin · ${us.filter(u => u.role === 'guru').length} guru · ${us.filter(u => u.role === 'pimpinan').length} pimpinan</span><button class="btn" onclick="uForm()">+ Tambah User</button></div>
    <div class="card tw"><table><thead><tr><th>No</th><th>Username</th><th>Nama</th><th>Role</th><th>Hak Akses</th><th>Aksi</th></tr></thead><tbody>
    ${us.map((u, i) => `<tr><td>${i + 1}</td><td>${esc(u.username)}</td><td>${esc(u.nama)}</td><td><span class="bdg ${esc(u.role)}">${esc(u.role)}</span></td><td style="white-space:normal">${hak(u)}</td>
    <td><button class="btn g s" onclick="uForm(${i})">Edit</button> <button class="btn r s" onclick="uDel(${i})">Hapus</button></td></tr>`).join('') || '<tr><td colspan="6" class="mu ctr">Belum ada user.</td></tr>'}
    </tbody></table></div>
    <div class="mu">Perubahan hak akses berlaku setelah user yang bersangkutan login ulang.</div>`;
}
function uRole(v) {
  $('#uKb').classList.toggle('hidden', v !== 'guru');
  $('#uInfo').textContent = ROLE_INFO[v] || '';
}
function uForm(i) {
  const e = i !== undefined, u = e ? us[i] : { role: 'guru' };
  const mine = new Set(String(u.kelas || '').split(',').map(x => x.trim()).filter(Boolean));
  const ks = [...new Set([...kelasList, ...mine])].sort(natural);
  $('#dlg').innerHTML = `<form onsubmit="uSave(event,${e})"><h2>${e ? 'Edit' : 'Tambah'} User</h2>
    <label>Username</label><input name="username" required autocapitalize="none" autocomplete="off" value="${esc(u.username || '')}" ${e ? 'readonly' : ''}>
    <label>Nama Lengkap</label><input name="nama" required value="${esc(u.nama || '')}">
    <label>Password ${e ? '(kosongkan jika tidak diubah)' : '(min. 6 karakter)'}</label>
    <div class="pw"><input name="password" id="upw" type="password" autocomplete="new-password" ${e ? '' : 'required'}><button type="button" class="eye" onclick="togglePwd(this,'upw')" aria-label="Lihat password">${EYE}</button></div>
    <label>Role</label><select name="role" onchange="uRole(this.value)">${['admin', 'guru', 'pimpinan'].map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${cap(r)}</option>`).join('')}</select>
    <div class="mu" id="uInfo" style="margin-top:6px;font-size:12px"></div>
    <div id="uKb"><label>Kelas yang dipegang</label><div class="ukb">${ks.map(k => `<label style="display:flex;gap:6px;text-transform:none;font-weight:400;color:var(--tx);margin:2px 0"><input type="checkbox" class="ukc" style="width:auto" value="${esc(k)}" ${mine.has(k) ? 'checked' : ''}>${esc(k)}</label>`).join('') || '<span class="mu">Belum ada kelas.</span>'}</div></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn g" onclick="$('#dlg').close()">Batal</button><button class="btn">Simpan</button></div></form>`;
  $('#dlg').showModal();
  uRole(u.role);
}
async function uSave(ev, isEdit) {
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(ev.target));
  d.kelas = d.role === 'guru' ? [...document.querySelectorAll('.ukc:checked')].map(c => c.value).join(',') : '';
  if (d.role === 'guru' && !d.kelas && !confirm('Tidak ada kelas dipilih — guru ini akan bisa mengakses SEMUA kelas.\nLanjutkan?')) return;
  busy(true);
  try {
    const r = isEdit ? await api('updateUser', d.username, d) : await api('addUser', d);
    busy(false);
    if (!r.success) return toast(r.message, true);
    $('#dlg').close(); toast(r.message || 'Tersimpan'); vUser().catch(fail);
  } catch (e) { fail(e); }
}
async function uDel(i) {
  const u = us[i];
  if (!confirm(`Hapus user "${u.username}" (${u.nama})?`)) return;
  busy(true);
  try {
    const r = await api('deleteUser', u.username);
    busy(false);
    if (!r.success) return toast(r.message, true);
    toast(r.message || 'User dihapus'); vUser().catch(fail);
  } catch (e) { fail(e); }
}

if (saved && saved.success) start(saved);
